name: CI

on:
  push:
    branches: [main, qwen3.8-flash-next, nemotron3.5-lightning]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pure-Python dependencies (no MLX)
        run: python -m pip install -r requirements-ci-linux.txt
      - name: Shared tests that do not need MLX
        run: python scripts/ci/linux_unit_tests.py
      - name: Secret scan
        run: python scripts/security/secret_scan.py

  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned runtime
        run: python -m pip install .
      - name: Test shared runtime
        run: python -m unittest discover -s veystrix/tests -t . -p 'test_*.py' -q
      - name: Test Flash-Next runtime
        env:
          VEYSTRIX_CI_RUNNER: "1"
        run: python -m unittest discover -s models/flashnext/tests/unit -t . -p 'test_*.py' -q
      - name: Test Nemotron runtime (all unit modules, synthetic/model-free)
        # models.nemotron35: all 16 unit modules, discovered so new ones need no CI edit.
        run: python -m unittest discover -s models/nemotron35/tests/unit -t . -p 'test_*.py' -q
      - name: Secret scan
        run: python scripts/security/secret_scan.py

  app:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Test the macOS app logic (no engine, no model)
        run: swift test --package-path apps/macos/Veystrix
      - name: Build the app (development, ad-hoc signed)
        run: packaging/macos/build_app.sh
