name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pure-Python dependencies (no MLX)
        run: python -m pip install -r requirements-ci-linux.txt
      - name: Shared tests that do not need MLX
        run: python scripts/ci/linux_unit_tests.py
      - name: Secret scan
        run: python scripts/security/secret_scan.py

  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned runtime
        run: python -m pip install .
      - name: Test shared runtime
        run: python -m unittest discover -s veystrix/tests -t . -p 'test_*.py' -q
      - name: Secret scan
        run: python scripts/security/secret_scan.py
