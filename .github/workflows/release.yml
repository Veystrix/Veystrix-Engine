name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned runtime
        run: python -m pip install .
      - name: Test shared runtime
        run: python -m unittest discover -s veystrix/tests -t . -p 'test_*.py' -q
      - name: Secret scan
        run: python scripts/security/secret_scan.py
